name: FORMA isolated visual-review APK
on:
  push:
    branches: ['forma/visual-review/**']
permissions:
  contents: read
jobs:
  visual-apk:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Generate disposable visual-preview signer
        run: |
          mkdir -p .forma-signing
          keytool -genkeypair -keystore .forma-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=FORMA Visual Preview,O=FORMA,C=RU" -keyalg RSA -keysize 2048 -validity 3650
      - run: ./gradlew :app:assembleDebug -PformaVisualReview=true --console=plain
      - name: Verify distinct package and APK signature
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          OUT=app/build/outputs/apk/debug
          "$AAPT" dump badging "$OUT/app-debug.apk" | tee "$OUT/APK_BADGING.txt"
          grep -F "name='ru.forma.fitness.visualreview'" "$OUT/APK_BADGING.txt"
          grep -F "versionName='0.2.0-visual'" "$OUT/APK_BADGING.txt"
          "$SIGNER" verify --verbose --print-certs "$OUT/app-debug.apk" > "$OUT/APK_SIGNATURE.txt"
          sha256sum "$OUT/app-debug.apk" > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: forma-visual-review-${{ github.sha }}
          path: app/build/outputs/apk/debug/
