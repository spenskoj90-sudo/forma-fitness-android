name: FORMA Android
on:
  push:
    branches: [main, 'forma/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: FORMA-only disposable debug signer
        run: |
          mkdir -p .forma-signing
          keytool -genkeypair -keystore .forma-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=FORMA Development,O=FORMA,C=RU" -keyalg RSA -keysize 2048 -validity 3650
      - run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: APK identity and signature evidence
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug
          sha256sum "$APK" > "$OUT/SHA256SUMS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$OUT/APK_SIGNATURE.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: forma-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: |
            domain/build/reports/
            app/build/reports/
  instrumentation:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: FORMA-only disposable debug signer
        run: |
          mkdir -p .forma-signing
          keytool -genkeypair -keystore .forma-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=FORMA Development,O=FORMA,C=RU" -keyalg RSA -keysize 2048 -validity 3650
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve emulator disk
        run: |
          # Hosted runners vary in free space. These preinstalled toolchains are
          # unrelated to this Android-only job and otherwise make AVD startup
          # nondeterministic (emulator 37 currently reserves 7.37 GB userdata).
          test ! -d /usr/share/dotnet || sudo rm -rf -- /usr/share/dotnet
          test ! -d /opt/ghc || sudo rm -rf -- /opt/ghc
          test ! -d /usr/local/lib/android/sdk/ndk || sudo rm -rf -- /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Offline Compose journey and process recovery
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.forma.app.JourneyTest --console=plain
            adb pull /sdcard/Android/data/ru.forma.fitness/files/evidence verification/screenshots-api${{ matrix.api }}
            adb shell am force-stop ru.forma.fitness
            adb shell settings put system font_scale 1.3
            if [ ${{ matrix.api }} -ge 33 ]; then adb shell pm revoke ru.forma.fitness android.permission.POST_NOTIFICATIONS; fi
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.forma.app.RecoveryTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-api${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            verification/screenshots-api${{ matrix.api }}/

