name: FORMA Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  # Cancel superseded initial PR runs only; preserve main/manual/rerun evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify one protected FORMA release route
        run: python3 scripts/check-release-workflows.py
      - run: chmod +x gradlew
      - name: FORMA-only disposable debug signer
        run: |
          mkdir -p .forma-signing
          keytool -genkeypair -keystore .forma-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=FORMA Development,O=FORMA,C=RU" -keyalg RSA -keysize 2048 -validity 3650
      - run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: APK identity and signature evidence
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug
          sha256sum "$APK" > "$OUT/SHA256SUMS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$OUT/APK_SIGNATURE.txt"
          "$AAPT" dump badging "$APK" > "$OUT/APK_BADGING.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: forma-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: |
            domain/build/reports/
            app/build/reports/
  instrumentation:
    needs: verify
    # Emulator/test hangs must not consume hours of CI runner time.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: FORMA-only disposable debug signer
        run: |
          mkdir -p .forma-signing
          keytool -genkeypair -keystore .forma-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=FORMA Development,O=FORMA,C=RU" -keyalg RSA -keysize 2048 -validity 3650
      - name: Build exact legacy base for API34 update test
        if: matrix.api == 34
        run: |
          git fetch --depth=1 origin 2fff305c22e9fe3f1d32c213777c14e7a2cc3560
          mkdir -p legacy
          git archive FETCH_HEAD | tar -x -C legacy
          mkdir -p legacy/.forma-signing
          cp .forma-signing/debug.keystore legacy/.forma-signing/debug.keystore
          cp app/src/androidTest/java/ru/forma/app/LegacySeedTest.kt legacy/app/src/androidTest/java/ru/forma/app/LegacySeedTest.kt
          cd legacy
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve emulator disk
        run: |
          # Hosted runners vary in free space. These preinstalled toolchains are
          # unrelated to this Android-only job and otherwise make AVD startup
          # nondeterministic (emulator 37 currently reserves 7.37 GB userdata).
          test ! -d /usr/share/dotnet || sudo rm -rf -- /usr/share/dotnet
          test ! -d /opt/ghc || sudo rm -rf -- /opt/ghc
          test ! -d /usr/local/lib/android/sdk/ndk || sudo rm -rf -- /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Offline Compose journey and process recovery
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash scripts/run-emulator-tests.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-api${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            verification/screenshots-api${{ matrix.api }}/
            verification/journey-api${{ matrix.api }}.txt
            verification/recovery-api${{ matrix.api }}.txt
            verification/failure-api${{ matrix.api }}.png
            verification/logcat-failure-api${{ matrix.api }}.txt
            legacy-seed.txt

