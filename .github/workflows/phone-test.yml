name: FORMA isolated phone-test APK
on:
  push:
    branches: ['forma/device-test/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Generate disposable FORMA phone-test signer
        run: |
          mkdir -p .forma-signing
          keytool -genkeypair -keystore .forma-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=FORMA Isolated Device Test,O=FORMA,C=RU" -keyalg RSA -keysize 2048 -validity 3650
      - name: Build independent install
        run: ./gradlew :app:assembleDebug -PformaPhysicalTest=true --console=plain
      - name: Check isolated identity, signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$OUT/APK_BADGING.txt"
          grep -F "name='ru.forma.fitness.physicaltest'" "$OUT/APK_BADGING.txt"
          grep -F "versionName='0.2.0-device-test'" "$OUT/APK_BADGING.txt"
          "$SIGNER" verify --verbose --print-certs "$APK" > "$OUT/APK_SIGNATURE.txt"
          sha256sum "$APK" | tee "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: forma-infinix-isolated-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/APK_BADGING.txt
            app/build/outputs/apk/debug/APK_SIGNATURE.txt
            app/build/outputs/apk/debug/SHA256SUMS
