name: FORMA manually signed candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with approved FORMA custody
        env:
          FORMA_RELEASE_KEYSTORE_B64: ${{ secrets.FORMA_RELEASE_KEYSTORE_B64 }}
          FORMA_RELEASE_STORE_PASSWORD: ${{ secrets.FORMA_RELEASE_STORE_PASSWORD }}
          FORMA_RELEASE_KEY_ALIAS: ${{ secrets.FORMA_RELEASE_KEY_ALIAS }}
          FORMA_RELEASE_KEY_PASSWORD: ${{ secrets.FORMA_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORMA_RELEASE_KEYSTORE_B64"
          test -n "$FORMA_RELEASE_STORE_PASSWORD"
          test -n "$FORMA_RELEASE_KEY_ALIAS"
          test -n "$FORMA_RELEASE_KEY_PASSWORD"
          export FORMA_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/forma-release.keystore"
          umask 077
          trap 'rm -f -- "$FORMA_RELEASE_KEYSTORE_PATH"' EXIT
          printf '%s' "$FORMA_RELEASE_KEYSTORE_B64" | base64 --decode > "$FORMA_RELEASE_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew :domain:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --console=plain
          APK=app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256SUMS
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$SIGNER" verify --verbose --print-certs "$APK" > app/build/outputs/apk/release/APK_SIGNATURE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: forma-signed-candidate-${{ github.sha }}
          path: app/build/outputs/apk/release/
