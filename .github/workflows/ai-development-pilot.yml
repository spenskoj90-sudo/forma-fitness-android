name: AI development pilot (synthetic)
on:
  workflow_dispatch:
    inputs:
      task:
        description: Reviewed synthetic task
        type: choice
        options: [clamp-v1]
        default: clamp-v1
        required: true
      model:
        description: Local model profile
        type: choice
        options: [qwen3-1.7b, qwen2.5-coder-3b]
        default: qwen3-1.7b
        required: true
      resume_run:
        description: Optional previous run ID from this workflow at the same commit
        type: string
        required: false
      expected_sha:
        description: Exact 40-character commit SHA for the selected ref
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: forma-ai-development-pilot
  cancel-in-progress: false

jobs:
  synthetic:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify reviewed task and immutable revision
        env:
          PILOT_TASK: ${{ inputs.task }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$PILOT_TASK" = clamp-v1
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover a checkpoint from a previous attempt
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          [[ "$RESUME_RUN" =~ ^[0-9]{1,20}$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN")"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_repository.full_name == $repo and
            .head_branch == "main" and .event == "workflow_dispatch" and
            .status == "completed" and .path == ".github/workflows/ai-development-pilot.yml"
          ' <<< "$run" >/dev/null
          attempt="$(jq -er '.run_attempt' <<< "$run")"
          download="$(mktemp -d)"
          gh run download "$RESUME_RUN" -R "$GITHUB_REPOSITORY" \
            -n "forma-ai-pilot-$RESUME_RUN-$attempt" -D "$download"
          checkpoint="$download/checkpoint.json"
          test -f "$checkpoint" && test ! -L "$checkpoint"
          test "$(wc -c < "$checkpoint")" -le 4096
          install -D -m 600 "$checkpoint" "$RUNNER_TEMP/forma-pilot/checkpoint.json"
      - name: Run the pinned local pilot
        env:
          PILOT_MODEL: ${{ inputs.model }}
          PILOT_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PILOT_REVISION"
          bash scripts/ai-pilot/run-local.sh "$PILOT_REVISION" "$RUNNER_TEMP/forma-pilot" "$PILOT_MODEL"
      - name: Save synthetic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: forma-ai-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/forma-pilot/checkpoint.json
            ${{ runner.temp }}/forma-pilot/candidate.patch
          retention-days: 7
          if-no-files-found: ignore
