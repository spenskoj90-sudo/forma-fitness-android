name: FORMA backend security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forma_admin
          POSTGRES_PASSWORD: ephemeral_admin_ci_only
          POSTGRES_DB: forma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forma_admin -d forma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      FORMA_TEST_ADMIN_DSN: postgresql://forma_admin:ephemeral_admin_ci_only@localhost:5432/forma_test
      FORMA_TEST_API_DSN: postgresql://forma_api:ephemeral_forma_ci_only@localhost:5432/forma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FORMA backend test dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify Python syntax
        working-directory: backend
        run: python -m compileall -q auth.py api.py test_auth.py test_api_security.py test_rls.py
      - name: Run offline security tests (no cloud credentials)
        working-directory: backend
        run: python -m pytest -q test_auth.py test_api_security.py test_rls.py
